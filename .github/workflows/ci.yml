name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce branch hierarchy and commit authorship
        run: python3 scripts/check_git_policy.py
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            meson ninja-build libglib2.0-bin desktop-file-utils appstream python3
      - name: Prepare Rust
        run: rustup update stable --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Rust warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Check repository and Python helpers
        run: |
          python3 scripts/check_repository.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build native installation
        run: |
          meson setup build --buildtype=debug --prefix=/usr
          meson compile -C build
          meson test -C build --print-errorlogs
          DESTDIR="$PWD/stage" meson install -C build
